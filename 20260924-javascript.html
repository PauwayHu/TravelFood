        // javascript原生語法 getElementByID找東西要取得id
        document.getElementById("00").innerText = "Hello World!";
        document.getElementById("01").innerHTML = "123456";
        document.getElementById("02").innerHTML = "abc";
        document.getElementById("03").innerHTML = "零壹貳叁肆";
        document.getElementById("04").innerHTML = "捌十萬";
        
        // 現在找得到 id="06" 了，不會再報錯
        document.getElementById("06").innerText = "123";

        // jquery 語法 , --> class # --> id
        $("#00").html("零壹貳叁肆");
        $("#01").html("零肆");

        
        // 迴圈 i++ (建議加上 let 來宣告變數)
        for(let i = 1; i <= 10; i++){
            console.log(i + ": Hello");
        }
        // 99乘法
        for(let i = 1; i < 10; i++){
            for(let j = 1; j < 10; j++){
                console.log(i + " X " + j + " = " + i*j);
            }
        }
        
        // 修正：將 i + 0 改為 let i = 0
        for(let i = 0; i < 5; i++){
            $("#06").append('<p class="mytitle-03">這是一個hello</p>');
        }
        // 要加#字號很重要
        for(i = 0; i < 10; i++){
            $("#07").append('<img src="images/building01.avif" width="600px" alt="">');
        }
        
        // 陣列 Array
